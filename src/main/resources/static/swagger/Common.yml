components:
  schemas:
    ApiErrorResponse:
      type: object
      description: Estructura estándar de respuesta de error del GlobalExceptionHandler
      properties:
        timestamp:
          type: string
          format: date-time
          description: Fecha y hora en que ocurrió el error (formato yyyy-MM-dd'T'hh:mm:ss a)
          example: '2024-01-15T10:30:00 AM'
        status:
          type: integer
          description: Código HTTP del error
          example: 404
        error:
          type: string
          description: Descripción estándar del código HTTP (HttpStatus.getReasonPhrase)
          example: Not Found
        message:
          type: string
          description: Mensaje descriptivo del error
          example: El recurso solicitado no existe
        path:
          type: string
          description: URI de la solicitud que generó el error
          example: /api/sucursales/123e4567-e89b-12d3-a456-426614174000

  responses:
    BadRequest:
      description: |
        Solicitud inválida. Puede deberse a:
        - Campos requeridos vacíos o nulos (`@NotBlank`, `@NotNull`)
        - Valores que exceden la longitud máxima (`@Size`)
        - Campo no existente o no modificable (PATCH)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            validationError:
              summary: Error de validación de campo
              value:
                timestamp: '2024-01-15T10:30:00 AM'
                status: 400
                error: Bad Request
                message: La direccion de la sucursal no puede ser vacio
                path: /api/sucursales
            invalidField:
              summary: Campo no modificable (PATCH)
              value:
                timestamp: '2024-01-15T10:30:00 AM'
                status: 400
                error: Bad Request
                message: EL campo no existe o no se puede modificar
                path: /api/sucursales/{id}/{field}

    Unauthorized:
      description: |
        No autenticado. El token JWT es inválido, está expirado o no fue enviado.
        Incluir header: `Authorization: Bearer <token>`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            timestamp: '2024-01-15T10:30:00 AM'
            status: 401
            error: Unauthorized
            message: Credenciales inválidas
            path: /api/auth/login

    NotFound:
      description: El recurso solicitado no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            timestamp: '2024-01-15T10:30:00 AM'
            status: 404
            error: Not Found
            message: El recurso solicitado no existe
            path: /api/sucursales/123e4567-e89b-12d3-a456-426614174000

    Conflict:
      description: El recurso ya existe en el sistema (valor duplicado)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            timestamp: '2024-01-15T10:30:00 AM'
            status: 409
            error: Conflict
            message: El nombre ya existe en el sistema
            path: /api/sucursales

    InternalServerError:
      description: Error interno inesperado del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            timestamp: '2024-01-15T10:30:00 AM'
            status: 500
            error: Internal Server Error
            message: Ha ocurrido un error inesperado en el servidor. Por favor, intente más tarde.
            path: /api/sucursales