paths:
  /api/productos:
    get:
      tags:
        - Productos
      summary: Obtener todos los productos
      operationId: getProducts
      responses:
        '200':
          description: Lista de productos obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductDto'
        '401':
          $ref: './Common.yml#/components/responses/Unauthorized'
        '500':
          $ref: './Common.yml#/components/responses/InternalServerError'

    post:
      tags:
        - Productos
      summary: Crear un nuevo producto
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Producto creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '400':
          $ref: './Common.yml#/components/responses/BadRequest'
        '401':
          $ref: './Common.yml#/components/responses/Unauthorized'
        '404':
          $ref: './Common.yml#/components/responses/NotFound'
        '500':
          $ref: './Common.yml#/components/responses/InternalServerError'

  /api/productos/{id}:
    get:
      tags:
        - Productos
      summary: Obtener un producto por ID
      operationId: getProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Producto encontrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '401':
          $ref: './Common.yml#/components/responses/Unauthorized'
        '404':
          $ref: './Common.yml#/components/responses/NotFound'
        '500':
          $ref: './Common.yml#/components/responses/InternalServerError'

    put:
      tags:
        - Productos
      summary: Actualizar un producto completo por ID
      operationId: updateProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Producto actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '400':
          $ref: './Common.yml#/components/responses/BadRequest'
        '401':
          $ref: './Common.yml#/components/responses/Unauthorized'
        '404':
          $ref: './Common.yml#/components/responses/NotFound'
        '500':
          $ref: './Common.yml#/components/responses/InternalServerError'

    delete:
      tags:
        - Productos
      summary: Eliminar un producto por ID
      operationId: deleteProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '204':
          description: Producto eliminado exitosamente
        '401':
          $ref: './Common.yml#/components/responses/Unauthorized'
        '404':
          $ref: './Common.yml#/components/responses/NotFound'
        '500':
          $ref: './Common.yml#/components/responses/InternalServerError'

  /api/productos/{id}/{field}:
    patch:
      tags:
        - Productos
      summary: Actualizar un campo específico de un producto
      operationId: patchProduct
      description: |
        Permite actualizar de forma parcial un campo del producto.

        **Campos permitidos:**
        - `name` — Nombre del producto
        - `price` — Precio del producto (debe ser un número decimal válido y positivo)
        - `stock` — Stock del producto (debe ser un número entero válido y positivo)
        - `branch` — Nombre de la sucursal a la que pertenece el producto
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: field
          in: path
          required: true
          description: Nombre del campo a actualizar
          schema:
            type: string
            enum:
              - name
              - price
              - stock
              - branch
          example: stock
        - name: value
          in: query
          required: true
          description: Nuevo valor para el campo especificado
          schema:
            type: string
          example: '150'
      responses:
        '200':
          description: Campo actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '400':
          $ref: './Common.yml#/components/responses/BadRequest'
        '401':
          $ref: './Common.yml#/components/responses/Unauthorized'
        '404':
          $ref: './Common.yml#/components/responses/NotFound'
        '500':
          $ref: './Common.yml#/components/responses/InternalServerError'

components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Identificador único UUID del producto
      schema:
        type: string
        format: uuid
      example: 123e4567-e89b-12d3-a456-426614174000

  schemas:
    ProductDto:
      type: object
      description: Representación completa de un producto
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Identificador único del producto (solo lectura)
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          maxLength: 100
          description: Nombre del producto
          example: Hamburguesa Clásica
        price:
          type: number
          format: decimal
          minimum: 0
          description: Precio del producto (positivo o cero)
          example: 15000.00
        stock:
          type: integer
          minimum: 0
          description: Stock disponible del producto (positivo o cero)
          example: 100
        branchName:
          type: string
          maxLength: 100
          description: Nombre de la sucursal a la que pertenece
          example: Sucursal Norte

    ProductRequest:
      type: object
      description: Cuerpo de solicitud para crear o actualizar un producto
      required:
        - name
        - branchName
      properties:
        name:
          type: string
          maxLength: 100
          description: Nombre del producto. No puede estar vacío.
          example: Hamburguesa Clásica
        price:
          type: number
          format: decimal
          minimum: 0
          description: Precio del producto (positivo o cero)
          example: 15000.00
        stock:
          type: integer
          minimum: 0
          description: Stock disponible del producto (positivo o cero)
          example: 100
        branchName:
          type: string
          maxLength: 100
          description: Nombre de la sucursal existente a asociar. No puede estar vacío.
          example: Sucursal Norte