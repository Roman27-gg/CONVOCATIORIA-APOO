volumes:
  postgres_data:
    driver: local
networks:
  api_network:
    driver: bridge
services:
  postgres:
    image: postgres:15-alpine
    container_name: postgress_apoo
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-user} -d ${DB_NAME:-mydb}" ]
      interval: 4s
      timeout: 7s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - api_network
  api:
    image: convocatoria_apoo:1.0
    container_name: api_apoo
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_URL : ${DB_URL}
      DB_USERNAME : ${DB_USERNAME}
      DB_PASSWORD : ${DB_PASSWORD}
      JWT_SECRET : ${JWT_SECRET}
    depends_on:
      - postgres
    networks:
      - api_network